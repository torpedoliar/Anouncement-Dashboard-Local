services:
  web:
    build: .
    ports:
      - "${PORT:-3100}:3000"
    # Non-secret config commmitted: AUTH_TRUST_HOST, NEXTAUTH_URL(kosong), dsb.
    env_file:
      - .env.production
    environment:
      # Database with connection pooling — hostname `db` dari compose, bukan substitution
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/announcement_db?schema=public&connection_limit=30&pool_timeout=30
      # Auth Security — SECRET diisi dari .env server (bukan ter-commit!)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Scheduler Security - call with: curl -H "Authorization: Bearer <CRON_SECRET>" http://localhost:3100/api/scheduler
      - CRON_SECRET=${CRON_SECRET}
      # Features
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      # Portal SSO — AES-256 key untuk enkripsi kredensial portal
      - PORTAL_CREDENTIAL_KEY=${PORTAL_CREDENTIAL_KEY}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Memory limits to prevent OOM crashes on Hyper-V
    mem_limit: 1536m
    memswap_limit: 2g
    # Health check for early crash detection
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=announcement_db
    # DB internal-only (tidak di-expose ke host) untuk keamanan produksi.
    # Untuk npm run dev lokal: lihat docker-compose.override.yml (gitignored) yang map 5433:5432.
    # Akses DB produksi: docker exec -it announcement-dashboard-db-1 psql -U postgres announcement_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=512MB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
