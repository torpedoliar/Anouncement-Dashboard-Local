services:
  web:
    build: .
    ports:
      - "${PORT:-3100}:3000"
    # Non-secret config commmitted: AUTH_TRUST_HOST, NEXTAUTH_URL(kosong), dsb.
    env_file:
      - .env.production
    environment:
      # Database with connection pooling — hostname `db` dari compose, bukan substitution
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/announcement_db?schema=public&connection_limit=30&pool_timeout=30
      # Auth Security — SECRET diisi dari .env server (bukan ter-commit!)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Scheduler Security - call with: curl -H "Authorization: Bearer <CRON_SECRET>" http://localhost:3100/api/scheduler
      - CRON_SECRET=${CRON_SECRET}
      # Features
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      # Portal SSO — AES-256 key untuk enkripsi kredensial portal
      - PORTAL_CREDENTIAL_KEY=${PORTAL_CREDENTIAL_KEY}
      # Portal Session Duration (detik) — default 43200 (12 jam) jika tidak disetel di .env.server
      - PORTAL_SESSION_MAX_AGE=${PORTAL_SESSION_MAX_AGE:-43200}
      # Layanan render Chromium (container terpisah) untuk deteksi SPA. Kosong = lapis browser mati.
      - PORTAL_BROWSER_URL=${PORTAL_BROWSER_URL:-http://browserless:3000}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Memory limits to prevent OOM crashes on Hyper-V
    mem_limit: 1536m
    memswap_limit: 2g
    # Health check for early crash detection
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=announcement_db
    # DB internal-only (tidak di-expose ke host) untuk keamanan produksi.
    # Untuk npm run dev lokal: lihat docker-compose.override.yml (gitignored) yang map 5433:5432.
    # Akses DB produksi: docker exec -it announcement-dashboard-db-1 psql -U postgres announcement_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=512MB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  browserless:
    # browserless/chromium sudah di-retired di Docker Hub (404); nama resmi adalah
    # browserless/chrome — endpoint HTTP /content tetap sama untuk deteksi SPA.
    image: browserless/chrome:latest
    restart: unless-stopped
    environment:
      - CONNECTION_TIMEOUT=10000
      - MAX_CONCURRENT_SESSIONS=2
      # Terima sertifikat self-signed untuk target intranet internal (lihat
      # detect-verify-v2 §5 keputusan C). Tanpa flag ini, Chromium abort pada
      # TLS handshake dan lapis 2 ladder selalu gagal untuk target internal.
      - CHROME_FLAGS=--ignore-certificate-errors
    # Bind ke jaringan internal compose saja — jangan di-expose ke host/publik.
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
