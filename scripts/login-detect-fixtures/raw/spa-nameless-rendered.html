<!DOCTYPE html>
<html lang="en">
<head><title>Internal App</title></head>
<body>
<div id="root">
  <div class="auth-card">
    <h1>Sign in</h1>
    <div id="__portal_login_detector_snapshot__" hidden aria-hidden="true">
      <form method="POST">
        <input type="email" name="email" autocomplete="email" placeholder="Work email">
        <input type="password" name="password" autocomplete="current-password" placeholder="Password">
        <button type="submit" value="">Continue</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
