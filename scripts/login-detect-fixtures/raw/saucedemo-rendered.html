<!DOCTYPE html>
<html lang="en">
<head><title>Swag Labs</title></head>
<body>
<div id="root">
  <div class="login_container">
    <div class="login-box">
      <form>
        <div class="form_group">
          <input class="input_error form_input" placeholder="Username" id="user-name" name="user-name" type="text" data-test="username" value="">
        </div>
        <div class="form_group">
          <input class="input_error form_input" placeholder="Password" id="password" name="password" type="password" data-test="password" value="">
        </div>
        <input type="submit" class="submit-button btn_action" data-test="login-button" value="Login" id="login-button" name="login-button">
      </form>
    </div>
  </div>
</div>
</body>
</html>
