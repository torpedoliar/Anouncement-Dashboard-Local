name: CI

# Gerbang kualitas: tiap push/PR dicek lint + build production.
# Deploy (deploy.yml) hanya jalan bila workflow ini hijau.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      # Build production perlu NEXTAUTH_URL (lihat komentar Dockerfile)
      - run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-dummy-secret-build-only
